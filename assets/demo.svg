<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="100%" height="100%">
  <defs>
    <linearGradient id="headerGradGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF66" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00AA44" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="shadowGreen" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#00FF66" flood-opacity="0.15"/>
    </filter>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&amp;display=swap');
      .terminal-text {
        font-family: 'JetBrains Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace;
        font-size: 13.5px;
        line-height: 22px;
      }
      .c-dim { fill: #6E7681; }
      .c-white { fill: #F0F6FC; }
      .c-green { fill: #00FF66; font-weight: 700; }
      .c-cyan { fill: #00F0FF; }
      .c-red { fill: #FF3366; font-weight: 700; }
      .c-yellow { fill: #FFBD2E; font-weight: 600; }
      .c-purple { fill: #D2A8FF; }

      @keyframes cycleAnim {
        0% { opacity: 0; transform: translateY(4px); }
        3% { opacity: 1; transform: translateY(0); }
        92% { opacity: 1; transform: translateY(0); }
        98% { opacity: 0; transform: translateY(-2px); }
        100% { opacity: 0; }
      }

      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }

      .cursor {
        animation: blink 1s infinite;
        fill: #00FF66;
      }

      .anim-l0 { animation: cycleAnim 13s ease infinite; animation-delay: 0.1s; }
      .anim-l1 { animation: cycleAnim 13s ease infinite; animation-delay: 1.0s; }
      .anim-l2 { animation: cycleAnim 13s ease infinite; animation-delay: 2.1s; }
      .anim-l3 { animation: cycleAnim 13s ease infinite; animation-delay: 3.2s; }
      .anim-l4 { animation: cycleAnim 13s ease infinite; animation-delay: 4.4s; }
      .anim-l5 { animation: cycleAnim 13s ease infinite; animation-delay: 5.5s; }
      .anim-l6 { animation: cycleAnim 13s ease infinite; animation-delay: 6.7s; }
      .anim-l7 { animation: cycleAnim 13s ease infinite; animation-delay: 7.8s; }
      .anim-l8 { animation: cycleAnim 13s ease infinite; animation-delay: 8.9s; }
      .anim-l9 { animation: cycleAnim 13s ease infinite; animation-delay: 10.0s; }
    </style>
  </defs>

  <!-- Terminal Window Outer Frame -->
  <rect x="10" y="10" width="860" height="450" rx="12" ry="12" fill="#0A0F0D" stroke="#00FF66" stroke-width="1.5" stroke-opacity="0.4" filter="url(#shadowGreen)"/>

  <!-- Titlebar -->
  <path d="M 10 22 C 10 15.37 15.37 10 22 10 L 858 10 C 864.63 10 870 15.37 870 22 L 870 46 L 10 46 Z" fill="#101B14"/>
  <line x1="10" y1="46" x2="870" y2="46" stroke="#1C2E23" stroke-width="1"/>

  <!-- Window Controls -->
  <circle cx="32" cy="28" r="6" fill="#FF5F56"/>
  <circle cx="52" cy="28" r="6" fill="#FFBD2E"/>
  <circle cx="72" cy="28" r="6" fill="#27C93F"/>

  <!-- Title text -->
  <text x="440" y="32" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#8B949E" font-weight="500">
    reality-lock — deterministic execution verification — 860x450
  </text>

  <!-- Terminal Content -->
  <g class="terminal-text" transform="translate(30, 80)">
    
    <!-- Line 0: Function Declaration -->
    <g class="anim-l0">
      <text x="0" y="0">
        <tspan class="c-green">❯ </tspan>
        <tspan class="c-yellow">@reality_locked</tspan>
        <tspan class="c-dim">(</tspan>
        <tspan class="c-cyan">risk</tspan><tspan class="c-dim">=</tspan><tspan class="c-white">RiskLevel.EXTERNAL_MUTATION</tspan><tspan class="c-dim">, </tspan>
        <tspan class="c-cyan">intent</tspan><tspan class="c-dim">=</tspan><tspan class="c-white">"Prune cluster nodes"</tspan>
        <tspan class="c-dim">)</tspan>
      </text>
    </g>

    <!-- Line 1: Pre-execution check -->
    <g class="anim-l1" transform="translate(0, 28)">
      <text x="0" y="0">
        <tspan class="c-dim">[REALITY-LOCK]</tspan>
        <tspan class="c-green"> Pre-Flight Guard Active</tspan>
        <tspan class="c-dim"> — Intercepting function: </tspan>
        <tspan class="c-white">prune_cluster_nodes()</tspan>
      </text>
    </g>

    <!-- Line 2: Policy Gate -->
    <g class="anim-l2" transform="translate(0, 56)">
      <text x="0" y="0">
        <tspan class="c-cyan">● POLICY EVALUATION:</tspan>
        <tspan class="c-yellow"> HIGH_RISK ACTION DETECTED</tspan>
        <tspan class="c-dim"> [Default-Deny Policy: </tspan><tspan class="c-white">ENFORCED</tspan><tspan class="c-dim">]</tspan>
      </text>
    </g>

    <!-- Line 3: Evidence Checkpoint -->
    <g class="anim-l3" transform="translate(0, 80)">
      <text x="0" y="0">
        <tspan class="c-dim">  └─ Pre-state snapshot: </tspan>
        <tspan class="c-white">snapshot_88c_29a</tspan>
        <tspan class="c-dim"> [Rollback checkpoint generated]</tspan>
      </text>
    </g>

    <!-- Line 4: Approval verification -->
    <g class="anim-l4" transform="translate(0, 114)">
      <text x="0" y="0">
        <tspan class="c-cyan">● OPERATOR CLEARANCE:</tspan>
        <tspan class="c-green"> GRANTED (Signed Authority Token: OP_BENNI_ROOT)</tspan>
      </text>
    </g>

    <!-- Line 5: Execution -->
    <g class="anim-l5" transform="translate(0, 138)">
      <text x="0" y="0">
        <tspan class="c-green">✔ Execution Completed:</tspan>
        <tspan class="c-white"> 4 inactive nodes drained cleanly in 0.82s</tspan>
      </text>
    </g>

    <!-- Line 6: Evidence Receipt -->
    <g class="anim-l6" transform="translate(0, 172)">
      <text x="0" y="0">
        <tspan class="c-cyan">● POST-FLIGHT EVIDENCE RECEIPT:</tspan>
        <tspan class="c-dim"> Minting immutable verification receipt...</tspan>
      </text>
    </g>

    <!-- Line 7: Hash & Status -->
    <g class="anim-l7" transform="translate(0, 196)">
      <text x="0" y="0">
        <tspan class="c-dim">  └─ Receipt Digest: </tspan>
        <tspan class="c-green">sha256:d8a201f4c78e390ab1288c5ef792...</tspan>
        <tspan class="c-dim"> (Valid &amp; Auditable)</tspan>
      </text>
    </g>

    <!-- Line 8: Reality locked -->
    <g class="anim-l8" transform="translate(0, 230)">
      <text x="0" y="0">
        <tspan class="c-white">Verdict: </tspan>
        <tspan class="c-green">REALITY LOCKED</tspan>
        <tspan class="c-dim"> | Hallucinations Prevented: </tspan>
        <tspan class="c-green">100%</tspan>
        <tspan class="c-dim"> | Rollback Ready: </tspan>
        <tspan class="c-white">YES</tspan>
      </text>
    </g>

    <!-- Line 9: Cursor -->
    <g class="anim-l9" transform="translate(0, 260)">
      <text x="0" y="0">
        <tspan class="c-green">❯ </tspan>
        <tspan class="c-dim">No unverified claims. Reality is locked.</tspan>
        <tspan class="cursor"> █</tspan>
      </text>
    </g>

  </g>

  <!-- Bottom Accent Stripe -->
  <rect x="10" y="457" width="860" height="3" fill="url(#headerGradGreen)" rx="1.5"/>
</svg>
