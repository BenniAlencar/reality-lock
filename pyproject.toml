[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reality-lock"
version = "1.0.0"
description = "The Deterministic Zero-Trust & Evidence Engine for AI Agents & MCP"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Benni OS Core Engineering Group", email = "engineering@bennios.dev"}
]
keywords = [
    "ai",
    "agents",
    "zero-trust",
    "evidence",
    "mcp",
    "model-context-protocol",
    "langchain",
    "crewai",
    "reality-lock",
    "guardrails",
    "verification"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
    "Typing :: Typed"
]
dependencies = [
    "pydantic>=2.0.0",
    "click>=8.0.0",
    "rich>=12.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]
mcp = [
    "mcp>=0.1.0",
]
langchain = [
    "langchain-core>=0.1.0",
]

[project.scripts]
reality-lock = "reality_lock.cli.main:cli"

[project.urls]
Homepage = "https://github.com/benni-os/reality-lock"
Documentation = "https://docs.bennios.dev/reality-lock"
Repository = "https://github.com/benni-os/reality-lock.git"
"Bug Tracker" = "https://github.com/benni-os/reality-lock/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["reality_lock*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
